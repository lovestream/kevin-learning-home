name: BENCH cloudflare local and modern Linux CI
on:
  push:
    branches: ['codex/bench-01-cloudflare']
  pull_request:
    branches: ['codex/bench-shared-contract']
permissions:
  contents: read
concurrency:
  group: bench-cloudflare-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  prototype:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.15.0'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:shared
      - run: npx tsc -p experiments/cloudflare/tsconfig.json
      - run: npx wrangler deploy --dry-run --outdir dist --config experiments/cloudflare/wrangler.jsonc
      - run: node experiments/cloudflare/native-smoke.mjs
      - run: node tests/platform-parity/run-platform.mjs cloudflare
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-cloudflare
          path: docs/benchmarks/results/cloudflare/*.json
