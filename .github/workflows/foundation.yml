name: Foundation, auth, shell and MATH-01
on:
  push:
    branches:
      [
        main,
        codex/implement-01-foundation,
        codex/implement-02a-auth,
        codex/implement-02b-shell,
        codex/02b-nas-trial,
        codex/math-00-source-audit,
        codex/math-01-readonly-lesson,
        codex/math-01-nas-trial,
        codex/math-full-01-70-lessons,
        codex/math-full-02-practice,
        codex/math-full-03-capabilities,
      ]
  pull_request:
    branches: [main, codex/math-full-01-70-lessons, codex/math-full-02-practice]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: "24.15.0", cache: npm }
      - run: npm install --global npm@11.12.1
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Chinese system font for reproducible UI evidence (CI only)
        run: |
          curl --fail --location --silent --show-error --connect-timeout 15 --max-time 120 --retry 2 https://raw.githubusercontent.com/notofonts/noto-cjk/f8d157532fbfaeda587e826d4cd5b21a49186f7c/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf -o /tmp/klh-ci-noto.otf
          echo '2c76254f6fc379fddfce0a7e84fb5385bb135d3e399294f6eeb6680d0365b74b  /tmp/klh-ci-noto.otf' | sha256sum -c -
          mkdir -p ~/.local/share/fonts/klh-ci
          cp /tmp/klh-ci-noto.otf ~/.local/share/fonts/klh-ci/NotoSansCJKsc-Regular.otf
          fc-cache -f ~/.local/share/fonts/klh-ci
      - name: NAS gate controller syntax only (no NAS connection)
        run: python3 tests/nas-gate/check-probes.py
      - name: Trial tooling offline checks (no NAS access)
        run: |
          python3 -m py_compile infra/trial/controller.py
          node --check tests/trial/browser.mjs
          node --test tests/trial/proxy.test.mjs
      - name: Math trial offline safety checks (no NAS access)
        run: |
          python3 -m unittest discover -s tests/math-trial -p 'test_*.py' -v
          node --test tests/math-trial/*.test.mjs
          node --check tests/math-trial/browser.mjs
      - name: MATH-00 source evidence checks (offline; no old repo or NAS)
        run: |
          set -euo pipefail
          mkdir -p .evidence/math-00
          python3 scripts/math-audit/check.py | tee .evidence/math-00/check.json
          python3 -m unittest discover -s tests/math-audit -p 'test_*.py' -v 2>&1 | tee .evidence/math-00/tests.log
      - name: NAS R2 preview-only image, LAN HTTP boundary and all 70 APIs (CI only)
        env:
          KLH_EXPORT_PREVIEW_IMAGE: ${{ github.event_name == 'push' && '1' || '0' }}
        run: |
          python3 -m unittest discover -s tests/math-preview -p 'test_*.py' -v
          node --test tests/math-preview/*.test.mjs
          mkdir -p .evidence/math-full-nas-r2
          set +e
          node tests/math-preview/container.mjs > .evidence/math-full-nas-r2/container.log 2>&1
          task_exit=$?
          tail -c 4000 .evidence/math-full-nas-r2/container.log
          exit "$task_exit"
      - name: Archive validated preview image for NAS transfer (push only)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: math-preview-image
          path: |
            .evidence/math-full-nas-r2/image.json
            .evidence/math-full-nas-r2/preview-amd64.tar.gz
          retention-days: 3
          compression-level: 0
      - run: node scripts/verify.ts
      - name: MATH-FULL-01 content-only preview and all 70 classrooms (no NAS access)
        run: |
          npm run build:math-preview
          python3 scripts/math-full-01/check.py
          node --test --test-concurrency=1 tests/math-full-01/*.test.*
          node tests/math-full-01/navigation.mjs
          node tests/math-full-01/browser.mjs --checkpoint
          node tests/math-full-01/browser.mjs
          node --test tests/math-full-02/practice.test.mjs
          node tests/math-full-02/browser.mjs
          node --test tests/math-full-remainder/library.test.mjs
          node tests/math-full-remainder/browser.mjs
      - name: Compose 1.28.5 parser compatibility (no daemon or service start)
        run: |
          curl --fail --location --silent --show-error https://github.com/docker/compose/releases/download/1.28.5/docker-compose-Linux-x86_64 -o /tmp/klh-compose-v1
          echo '46406eb5d8443cc0163a483fcff001d557532a7fad5981e268903ad40b75534c  /tmp/klh-compose-v1' | sha256sum -c -
          chmod u+x /tmp/klh-compose-v1
          env KLH_APP_IMAGE=klh-ci:synthetic KLH_UID=1001 KLH_GID=1001 KLH_DATA_HOST=/tmp/klh-ci/data KLH_MEDIA_HOST=/tmp/klh-ci/media KLH_CONTENT_HOST=/tmp/klh-ci/content /tmp/klh-compose-v1 -f infra/docker/compose.yml config > .evidence/compose-v1.yml
      - name: Container isolation and restored-host verification
        run: |
          set +e
          npm run test:container > .evidence/container-build.log 2>&1
          task_exit=$?
          tail -c 4000 .evidence/container-build.log
          exit "$task_exit"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: implement-02b-evidence
          path: |
            .evidence
            !.evidence/math-full-nas-r2/preview-amd64.tar.gz
          retention-days: 14
          include-hidden-files: true
