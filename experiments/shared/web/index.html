<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Learning Home · 合成实验</title><link rel="stylesheet" href="/style.css"><body>
<header><span>KEVIN LEARNING HOME</span><strong>双路线合成实验</strong><small>不包含真实学习记录</small></header>
<main><section id="login"><h1>进入实验课堂</h1><label>合成学习者<select id="learner"><option>synthetic-a</option><option>synthetic-b</option></select></label><label>实验角色<select id="role"><option value="learner">学生</option><option value="parent">家长</option></select></label><button id="loginButton">登录合成账户</button></section>
<section id="classroom" hidden><nav><button id="mathTab">数学</button><button id="englishTab">英语</button><button id="refresh">刷新服务器状态</button></nav><p id="identity"></p><h1 id="prompt"></h1><div id="choices"></div><label>原始作答<input id="answer" autocomplete="off" placeholder="填写答案"></label><div class="actions"><button id="submit">提交并保存</button><button id="hint">记录提示</button><button id="resolve">按最新状态重新提交草稿</button><button id="newAttempt">开始新一轮</button><button id="retry">重试未同步命令</button></div><p id="sync" role="status"></p><pre id="result"></pre><details><summary>已保存的实验状态</summary><pre id="saved"></pre></details></section>
</main><footer>本地原型 · 首答、提示、订正分别记录 · 数学与英语奖励隔离</footer><script type="module" src="/app.js"></script></body></html>
